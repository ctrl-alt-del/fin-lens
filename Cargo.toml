[package]
name = "fin-lens"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "轻量级基金穿透估值与监控系统"
publish = false

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "chrono",
    "migrate",
    "macros",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "2"
anyhow = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

# 极低资源占用：体积优先
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
